name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve install scripts
        run: npm install-scripts approve esbuild || true

      - name: Build shared contracts
        run: npm run build --workspace @skillmap/shared

      - name: Lint
        run: npx eslint packages/ scripts/ tests/

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check "packages/**/*.{ts,tsx}" "tests/**/*.ts" "*.{json,md,yml}"

      - name: Unit and API tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check for committed secrets
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed. Remove it and rotate the secrets."
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Approve install scripts
        run: npm install-scripts approve esbuild || true

      - name: Build client
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
